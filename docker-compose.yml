services:
  # --- PERSISTENT STORAGE ---
  redis:
    container_name: onion-pipe-redis
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - onion-internal

  # --- MASTER CONTROLLER (The Brain) ---
  master:
    container_name: onion-pipe-master
    image: sapphive/onion-pipe-relay:latest
    restart: always
    # No ports exposed to host - handled by NPM via npm_public network
    environment:
      - MASTER=true
      - REDIS_URL=redis://redis:6379
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - PUBLIC_RELAY_URL=${PUBLIC_RELAY_URL}
      # - REGISTRATION_SECRET=${REGISTRATION_SECRET}
    depends_on:
      - redis
    networks:
      - npm_public
      - onion-internal

  # --- INTERNAL BRIDGE (Initial Workload) ---
  # Ensures the relay works immediately even if no community bridges join.
  internal-bridge:
    container_name: onion-pipe-internal-bridge
    image: sapphive/onion-pipe-relay:latest
    restart: always
    environment:
      - BRIDGE_MODE=true
      - RELAY_URL=ws://master:3000
    depends_on:
      - master
    networks:
      - onion-internal

networks:
  # This network must already exist (created by your Nginx Proxy Manager setup)
  npm_public:
    external: true
  onion-internal:
    driver: bridge

volumes:
  redis_data:
