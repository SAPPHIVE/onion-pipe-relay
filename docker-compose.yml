services:
  # --- PERSISTENT STORAGE ---
  redis:
    container_name: onion-pipe-redis
    image: redis:alpine
    restart: always
    # Forces Redis to write to disk frequently and use the Append Only File (AOF)
    command: ["sh", "-c", "redis-server --appendonly yes --save 60 1 --requirepass \"$$(tr -d '\\r' < /run/secrets/redis_password)\""]
    volumes:
      - redis_data:/data
    networks:
      - onion-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(tr -d '\\r' < /run/secrets/redis_password)\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    secrets:
      - redis_password

  # --- MASTER CONTROLLER (The Brain) ---
  master:
    container_name: onion-pipe-master
    image: sapphive/onion-pipe-relay:latest
    restart: always
    # No ports exposed to host - handled by NPM via npm_public network
    environment:
      - MASTER=true
      - REDIS_URL=redis://redis:6379
      - ADMIN_USER_FILE=/run/secrets/admin_user
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - GITHUB_CLIENT_ID_FILE=/run/secrets/github_client_id
      - GITHUB_CLIENT_SECRET_FILE=/run/secrets/github_client_secret
      - SESSION_SECRET_FILE=/run/secrets/session_secret
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - PUBLIC_RELAY_URL=${PUBLIC_RELAY_URL}
      # - REGISTRATION_SECRET_FILE=/run/secrets/registration_secret
    secrets:
      - admin_user
      - admin_password
      - github_client_id
      - github_client_secret
      - session_secret
      - redis_password
      # - registration_secret
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - npm_public
      - onion-internal

  # --- INTERNAL BRIDGE (Initial Workload) ---
  # Ensures the relay works immediately even if no community bridges join.
  internal-bridge:
    container_name: onion-pipe-internal-bridge
    image: sapphive/onion-pipe-relay:latest
    restart: always
    environment:
      - BRIDGE_MODE=true
      - RELAY_URL=ws://master:3000
    depends_on:
      - master
    networks:
      - onion-internal

networks:
  # This network must already exist (created by your Nginx Proxy Manager setup)
  npm_public:
    external: true
  onion-internal:
    driver: bridge

volumes:
  redis_data:
    driver: local

secrets:
  redis_password:
    file: ./secrets/redis_password
  admin_user:
    file: ./secrets/admin_user
  admin_password:
    file: ./secrets/admin_password
  github_client_id:
    file: ./secrets/github_client_id
  github_client_secret:
    file: ./secrets/github_client_secret
  session_secret:
    file: ./secrets/session_secret
